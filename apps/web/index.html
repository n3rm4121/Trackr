<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_SITE_NAME%</title>
    <script>
      // Runs before first paint so a dark-mode user never sees a white flash.
      // Kept inline and tiny on purpose; the React hook in lib/use-theme.ts
      // takes over once mounted. The storage key is config.themeStorageKey,
      // which an inline script cannot import, so the two go in step.
      (function () {
        try {
          var stored = localStorage.getItem("trackr-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
